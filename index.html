<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>AIsuperpowers · AI Readiness Check</title>
<!-- AIS Fit Assessment app v5 (2026-08-24). Spec: SPEC.md in AIspowers/lead-assessment (private).
     v5 = cold-handover intro (two screens, no presumed meeting), team voice (no personal names),
          on-screen readiness snapshot from relay-returned deterministic levels.
     v4 = bilingual EN + formal business Arabic (fusha), RTL, Amiri + IBM Plex Sans Arabic.
     v3 = tactile paper-depth design. v2 = Codex evidence-doctrine.
     No secrets here: RELAY_TOKEN is an abuse gate only; scoring + analysis are server-side. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;450;500;600;700&family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFBF2; --paper2:#FBF4E4; --ink:#141B26; --ink2:#3E4A5C; --mute:#7C8798;
  --rule:#DCD2BE; --rule2:#C9BEA6; --ghost:rgba(20,27,38,.07);
  --accent:#EA580C; --accent-deep:#C2410C; --plate:#FFFDF6;
  --sh-s:0 1px 2px rgba(20,27,38,.05), 0 2px 8px rgba(20,27,38,.05);
  --sh-m:0 2px 4px rgba(20,27,38,.05), 0 10px 24px rgba(20,27,38,.09);
  --sh-l:0 6px 14px rgba(20,27,38,.07), 0 24px 50px rgba(20,27,38,.13);
  --sh-in:inset 0 2px 5px rgba(20,27,38,.09), inset 0 1px 2px rgba(20,27,38,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",sans-serif;
  font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100svh;
  background:
    radial-gradient(120% 90% at 50% -10%, #FFFEF9 0%, var(--paper) 55%, #F6EEDC 100%);
  background-attachment:fixed}
html[lang=ar] body{font-family:"IBM Plex Sans Arabic",Inter,-apple-system,sans-serif;font-size:16px;line-height:1.75}
::selection{background:var(--accent);color:#FFFBF2}
input,textarea{caret-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.serif{font-family:"Playfair Display",Georgia,serif}
html[lang=ar] .serif{font-family:"Amiri","Playfair Display",Georgia,serif}
.caps{font-size:11.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .caps,html[lang=ar] .pcount,html[lang=ar] .field label,html[lang=ar] .foot{letter-spacing:0}
.wrap{max-width:560px;margin:0 auto;padding:0 22px calc(34px + env(safe-area-inset-bottom))}

.screen{display:none;animation:rise .45s cubic-bezier(.2,.9,.25,1)}
.screen.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.screen{animation:none}.opt,.btn,.backbtn{transition:none!important}}

/* ---------- elevated card language ---------- */
.card{background:var(--plate);border:1px solid rgba(201,190,166,.55);border-radius:14px;
  box-shadow:var(--sh-m);padding:clamp(18px,4.6vw,26px)}
.card + .card{margin-top:16px}

/* ---------- language toggle ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:34px}
.firm{font-size:21px;font-weight:700;letter-spacing:-.02em;font-family:Inter,-apple-system,sans-serif}
.firm b{color:var(--accent);font-weight:700}
.langs{display:flex;background:var(--paper2);border:1px solid var(--rule2);border-radius:99px;padding:3px;box-shadow:var(--sh-in)}
.langs button{font:inherit;font-size:13px;font-weight:600;border:none;background:none;color:var(--mute);
  padding:5px 13px;border-radius:99px;cursor:pointer}
.langs button.on{background:var(--plate);color:var(--ink);box-shadow:var(--sh-s)}
.langs button[data-l=ar]{font-family:"IBM Plex Sans Arabic",sans-serif}

/* ---------- welcome ---------- */
.hero h1{font-family:"Playfair Display",serif;font-weight:500;font-size:clamp(29px,7.6vw,38px);line-height:1.14;margin:28px 0 12px;text-wrap:balance}
html[lang=ar] .hero h1{font-family:"Amiri",serif;font-weight:700;line-height:1.5}
.hero .lead{color:var(--ink2);font-size:16px;max-width:44ch;margin:0 0 24px}
.hero .titlerule{border:none;border-top:1px solid var(--ink);width:64px;margin:0 0 22px;margin-inline-start:0;margin-inline-end:auto}
.introcards{margin:0 0 18px}
.introhead{font-family:"Playfair Display",serif;font-size:19px;font-weight:600;margin:0 0 14px}
html[lang=ar] .introhead{font-family:"Amiri",serif;font-size:21px;font-weight:700}
.step{display:grid;grid-template-columns:34px 1fr;gap:14px;align-items:start;padding:11px 0}
.step + .step{border-top:1px solid var(--rule)}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--paper2);border:1px solid var(--rule2);
  box-shadow:var(--sh-s);display:flex;align-items:center;justify-content:center;
  font-family:"Playfair Display",serif;font-weight:600;font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.step p{margin:2px 0 0;font-size:14.5px;color:var(--ink2)}
.step p b{color:var(--ink);font-weight:600}
.ready{list-style:none;margin:0;padding:0}
.ready li{position:relative;padding-inline-start:24px;margin:0 0 12px;color:var(--ink2);font-size:14.5px}
.ready li::before{content:"";position:absolute;inset-inline-start:0;top:.5em;width:9px;height:9px;background:var(--accent);border-radius:2px;box-shadow:0 1px 2px rgba(194,65,12,.4)}
.ready li b{color:var(--ink);font-weight:600}
.field{margin:0 0 16px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.field input,.field select{width:100%;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--paper2);border:1px solid var(--rule2);border-radius:9px;outline:none;box-shadow:var(--sh-in)}
.field input:focus,.field select:focus{border-color:var(--accent);background:#FFFDF6}
.privacy{font-size:12.5px;color:var(--mute);margin:16px 0 20px;max-width:46ch}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px 18px;
  font:inherit;font-size:16px;font-weight:600;color:#FFFBF2;background:var(--ink);
  border:none;border-radius:11px;cursor:pointer;position:relative;
  box-shadow:0 2px 0 #0A0F17, var(--sh-m);transition:transform .12s ease, box-shadow .12s ease}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #0A0F17, var(--sh-s)}
.btn.accent{background:linear-gradient(180deg,#F1691F 0%,var(--accent) 55%,#DE5108 100%);
  box-shadow:0 2px 0 var(--accent-deep), var(--sh-m)}
.btn.accent:active{box-shadow:0 0 0 var(--accent-deep), var(--sh-s)}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:var(--sh-s)}
.btn.ghostbtn{background:var(--plate);color:var(--ink2);border:1px solid var(--rule2);
  box-shadow:0 2px 0 rgba(201,190,166,.7), var(--sh-s)}
.btn.ghostbtn:active{box-shadow:0 0 0 rgba(201,190,166,.7), var(--sh-s)}

/* ---------- exchange (what you get / what we get) ---------- */
.give{display:grid;grid-template-columns:1fr;gap:0}
.give .row{padding:12px 0}
.give .row + .row{border-top:1px solid var(--rule)}
.give .gk{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
html[lang=ar] .give .gk{letter-spacing:0}
.give p{margin:0;font-size:14.5px;color:var(--ink2)}

/* ---------- readiness snapshot ---------- */
.snap{text-align:start;margin:0 0 26px}
.snap .caps{margin-bottom:14px}
.sdim{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;padding:9px 0}
.sdim + .sdim{border-top:1px solid var(--rule)}
.sdim .sl{font-size:13.5px;font-weight:600;color:var(--ink)}
.sdim .sm{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-deep)}
html[lang=ar] .sdim .sm{letter-spacing:0}
.sdim .sbar{grid-column:1 / -1;height:6px;background:var(--paper2);border-radius:4px;overflow:hidden;box-shadow:var(--sh-in)}
.sdim .sbar i{display:block;height:100%;background:linear-gradient(180deg,#F1691F,var(--accent-deep));border-radius:4px}
.snapnote{font-size:12px;color:var(--mute);margin:12px 0 0}

/* ---------- quiz ---------- */
.qtop{display:flex;align-items:center;gap:14px;padding:20px 0 10px;position:sticky;top:0;z-index:5;
  background:linear-gradient(180deg, #FFFEF9 78%, rgba(255,254,249,0))}
.backbtn{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--rule2);background:var(--plate);
  color:var(--ink2);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 rgba(201,190,166,.7), var(--sh-s);transition:transform .12s ease, box-shadow .12s ease}
.backbtn:active{transform:translateY(2px);box-shadow:0 0 0 rgba(201,190,166,.7), var(--sh-s)}
html[dir=rtl] .backbtn .arr{display:inline-block;transform:scaleX(-1)}
.progress{flex:1}
.pbar{height:6px;background:var(--paper2);border-radius:4px;overflow:hidden;box-shadow:var(--sh-in)}
.pbar i{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 50%;background:linear-gradient(180deg,#F1691F,var(--accent-deep));border-radius:4px;transition:transform .3s cubic-bezier(.2,.9,.25,1)}
html[dir=rtl] .pbar i{transform-origin:100% 50%}
.pcount{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--mute);margin-top:7px;text-transform:uppercase;font-variant-numeric:tabular-nums}
.qtext{font-family:"Playfair Display",serif;font-size:clamp(21px,5.6vw,26px);font-weight:500;line-height:1.32;margin:18px 0 6px;text-wrap:pretty}
html[lang=ar] .qtext{font-family:"Amiri",serif;font-weight:700;line-height:1.55}
.qhint{font-size:14px;color:var(--mute);margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:11px;padding-bottom:24px}
.opt{display:flex;align-items:flex-start;gap:13px;text-align:start;width:100%;padding:14px 15px;
  font:inherit;font-size:15.5px;line-height:1.45;color:var(--ink);background:var(--plate);
  border:1px solid rgba(201,190,166,.55);border-radius:12px;cursor:pointer;
  box-shadow:var(--sh-s);transition:transform .12s ease, box-shadow .12s ease, background .12s ease}
.opt:active{transform:translateY(1px) scale(.995)}
.opt .chip{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--rule2);background:var(--paper2);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mute);margin-top:1px;
  box-shadow:var(--sh-s)}
.opt.sel{border-color:var(--accent);background:#FFF3E8;box-shadow:var(--sh-in)}
.opt.sel .chip{background:linear-gradient(180deg,#F1691F,var(--accent-deep));border-color:var(--accent-deep);color:#fff;
  box-shadow:0 1px 2px rgba(194,65,12,.5)}
.opt small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
textarea.freetext{width:100%;min-height:130px;padding:14px;font:inherit;font-size:16px;line-height:1.55;color:var(--ink);
  background:var(--paper2);border:1px solid var(--rule2);border-radius:12px;outline:none;resize:vertical;box-shadow:var(--sh-in)}
textarea.freetext:focus,input.shorttext:focus{border-color:var(--accent);background:#FFFDF6}
input.shorttext{width:100%;padding:14px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--paper2);border:1px solid var(--rule2);border-radius:12px;outline:none;box-shadow:var(--sh-in)}
.charnote{font-size:12px;color:var(--mute);margin:8px 0 16px}
.charnote.ok{color:#166534}
.qactions{padding:4px 0 34px}
.qactions .btn + .btn{margin-top:12px}

/* ---------- compute / insight ---------- */
.center{min-height:72svh;display:flex;flex-direction:column;justify-content:center}
.spin{width:44px;height:44px;border-radius:50%;border:3px solid var(--ghost);border-top-color:var(--accent);
  animation:spin 1s linear infinite;margin-bottom:26px}
@keyframes spin{to{transform:rotate(360deg)}}
.compute h2,.insight h2{font-family:"Playfair Display",serif;font-weight:500;font-size:26px;margin:0 0 10px}
html[lang=ar] .compute h2,html[lang=ar] .insight h2{font-family:"Amiri",serif;font-weight:700}
.compute p{color:var(--ink2);max-width:40ch}
.quotecard{position:relative;background:var(--plate);border:1px solid rgba(201,190,166,.55);border-radius:16px;
  box-shadow:var(--sh-l);padding:30px 24px 24px;margin:24px 0 26px}
.quotecard .qmark{position:absolute;top:-18px;inset-inline-start:18px;width:44px;height:44px;border-radius:50%;
  background:linear-gradient(180deg,#F1691F,var(--accent-deep));color:#FFFBF2;display:flex;align-items:center;justify-content:center;
  font-family:"Playfair Display",serif;font-size:30px;font-weight:600;line-height:1;padding-top:12px;
  box-shadow:0 2px 0 var(--accent-deep), var(--sh-m)}
.insightline{font-family:"Playfair Display",serif;font-size:19px;line-height:1.6;color:var(--ink);margin:0;max-width:36em}
html[lang=ar] .insightline{font-family:"Amiri",serif;font-size:20px;line-height:1.9}
.insight .after{color:var(--ink2);font-size:15px;max-width:44ch;margin-bottom:26px}
.foot{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">

  <!-- WELCOME -->
  <section class="screen on" id="s-welcome">
    <div class="topbar">
      <div class="firm">AI<b>superpowers</b></div>
      <div class="langs" role="group" aria-label="Language">
        <button data-l="en" id="lang-en">EN</button>
        <button data-l="ar" id="lang-ar">العربية</button>
      </div>
    </div>
    <div class="hero">
      <h1 data-i="h1"></h1>
      <hr class="titlerule">
      <p class="lead" data-i="lead"></p>
    </div>

    <div class="introcards">
      <div class="card give">
        <div class="row"><div class="gk" data-i="youGetB"></div><p data-i="youGet"></p></div>
        <div class="row"><div class="gk" data-i="weGetB"></div><p data-i="weGet"></p></div>
      </div>
      <button class="btn accent" id="introbtn" style="margin-top:18px" data-i="introCta"></button>
    </div>
    <div class="foot"><span>AIsuperpowers</span><span data-i="footTag"></span></div>
  </section>

  <!-- BRIEF (screen two: how it works + have ready + contact) -->
  <section class="screen" id="s-brief">
    <div class="qtop">
      <button class="backbtn" id="briefback" aria-label="Back"><span class="arr">&#8592;</span></button>
      <div class="firm" style="font-size:18px">AI<b>superpowers</b></div>
    </div>
    <div class="introcards" style="margin-top:14px">
      <div class="card">
        <h2 class="introhead" data-i="howHead"></h2>
        <div class="step"><span class="n">1</span><p><b data-i="s1b"></b> <span data-i="s1"></span></p></div>
        <div class="step"><span class="n">2</span><p><b data-i="s2b"></b> <span data-i="s2"></span></p></div>
        <div class="step"><span class="n">3</span><p><b data-i="s3b"></b> <span data-i="s3"></span></p></div>
      </div>
      <div class="card">
        <h2 class="introhead" data-i="readyHead"></h2>
        <ul class="ready">
          <li><b data-i="r1b"></b> <span data-i="r1"></span></li>
          <li><b data-i="r2b"></b> <span data-i="r2"></span></li>
          <li><b data-i="r3b"></b> <span data-i="r3"></span></li>
        </ul>
      </div>
      <div class="card">
        <div class="field"><label for="f-name" data-i="lName"></label><input id="f-name" autocomplete="name"></div>
        <div class="field"><label for="f-org" data-i="lOrg"></label><input id="f-org" autocomplete="organization"></div>
        <div class="field"><label for="f-email" data-i="lEmail"></label><input id="f-email" type="email" autocomplete="email" placeholder="you@company.com"></div>
        <p class="privacy" data-i="privacy"></p>
        <button class="btn accent" id="startbtn" data-i="begin"></button>
      </div>
    </div>
    <div class="foot"><span>AIsuperpowers</span><span data-i="footTag"></span></div>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="s-quiz">
    <div class="qtop">
      <button class="backbtn" id="backbtn" aria-label="Back"><span class="arr">&#8592;</span></button>
      <div class="progress"><div class="pbar"><i id="pfill"></i></div><div class="pcount" id="pcount"></div></div>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="qhint" id="qhint"></div>
    <div class="opts" id="opts"></div>
    <div class="qactions" id="qactions"></div>
  </section>

  <!-- COMPUTE -->
  <section class="screen" id="s-compute">
    <div class="center compute">
      <div class="spin"></div>
      <h2 data-i="computeH"></h2>
      <p data-i="computeP"></p>
    </div>
  </section>

  <!-- INSIGHT -->
  <section class="screen" id="s-insight">
    <div class="center insight">
      <div class="firm">AI<b>superpowers</b></div>
      <h2 style="margin-top:30px" data-i="insightH"></h2>
      <div class="quotecard"><span class="qmark" aria-hidden="true">&#8220;</span><blockquote class="insightline" id="insighttext"></blockquote></div>
      <div class="card snap" id="snapblock" style="display:none">
        <div class="caps" data-i="snapHead"></div>
        <div id="snapdims"></div>
        <p class="snapnote" data-i="snapNote"></p>
      </div>
      <p class="after" data-i="insightAfter"></p>
      <p class="caps" style="margin:-14px 0 26px" data-i="teamSign"></p>
      <div id="testerbox"></div>
      <div class="foot"><span>AIsuperpowers</span><span id="reffoot"></span></div>
    </div>
  </section>

</div>

<script>
"use strict";
/* ================= CONFIG ================= */
const RELAY_URL = "https://script.google.com/macros/s/AKfycbzcNphxbwdc-L8XAuQTPtOPnxs0rWPQ2BrsebzN2sXLUHNwM9n6_m2MNIPF9iAGBmMR/exec";
const RELAY_TOKEN = "ais-fit-2026";
const MIN_EXAMPLE_CHARS = 40;

/* ================= LANGUAGE ================= */
let lang = "en";
try{ lang = localStorage.getItem("ais-fit-lang")==="ar" ? "ar" : "en"; }catch(e){}
function T(en, ar){ return (lang==="ar" && ar) ? ar : en; }

const UI = {
  h1:      ["A five-minute AI readiness check.", "فحص جاهزيتكم للذكاء الاصطناعي، في خمس دقائق."],
  lead:    ["Answer a short set of questions about a real problem or ambition. You see where you stand today. We come back to you with something concrete, not a pitch.",
            "تجيبون عن مجموعة قصيرة من الأسئلة حول مشكلة قائمة أو طموح فعلي لديكم، فترون أين تقفون اليوم، ثم نعود إليكم بطرح ملموس، لا بعرض تسويقي."],
  youGetB: ["What you get", "ما تحصلون عليه"],
  youGet:  ["An immediate observation on your situation, and a snapshot of where you stand today.",
            "ملاحظة فورية حول وضعكم، ولمحة توضح أين تقفون اليوم."],
  weGetB:  ["What we get", "ما نحصل عليه"],
  weGet:   ["Enough understanding of your situation to come back to you prepared, with thinking rather than discovery questions.",
            "فهم كافٍ لوضعكم يتيح لنا العودة إليكم باستعداد حقيقي وتفكير ناضج، لا بأسئلة استكشافية."],
  introCta:["See how it works", "تعرّفوا على آلية العمل"],
  howHead: ["How this works", "كيف يعمل هذا"],
  s1b: ["You answer, about five minutes.", "تجيبون، خلال خمس دقائق تقريبًا."],
  s1:  ["Mostly taps, one written answer. \"Not sure yet\" is always a valid answer.", "معظمها اختيارات سريعة، وإجابة واحدة مكتوبة. و«لسنا متأكدين بعد» إجابة مقبولة دائمًا."],
  s2b: ["The AIsuperpowers team studies your answers.", "يدرس فريق AIsuperpowers إجاباتكم."],
  s2:  ["Your situation is read and a first direction is sketched, before anything is booked or proposed.", "يُقرأ وضعكم ويُرسم اتجاه أولي، قبل حجز أي اجتماع أو تقديم أي عرض."],
  s3b: ["You see where you stand.", "ترون أين تقفون."],
  s3:  ["An immediate observation the moment you finish, and, where there is a real fit, a written snapshot of your readiness.", "ملاحظة فورية لحظة الانتهاء، وإذا كان ثمة توافق حقيقي، لمحة مكتوبة عن جاهزيتكم."],

/* ================= FLOW ENGINE ================= */
function routeOf(a){
  if(a.q4none) return "explorer";
  if(typeof a.q4==="string" && a.q4.trim().length>0) return "problem";
  return null;
}
function sequence(a){
  const route = routeOf(a);
  const seq = [];
  for(const q of QS){
    if(q.branch && q.branch!==route) continue;
    if(q.overlay==="gov" && a.q1!=="gov") continue;
    if(q.showIf && !q.showIf(a)) continue;
    seq.push(q);
  }
  return seq;
}

/* ================= STATE ================= */
const $=id=>document.getElementById(id);
const screens={welcome:$("s-welcome"),brief:$("s-brief"),quiz:$("s-quiz"),compute:$("s-compute"),insight:$("s-insight")};
let state={contact:{name:"",org:"",email:""}, answers:{}, i:0, ref:null, done:false};
try{const s=JSON.parse(localStorage.getItem("ais-fit")||"null"); if(s&&s.answers) state=s;}catch(e){}
function save(){try{localStorage.setItem("ais-fit",JSON.stringify(state))}catch(e){}}
function show(k){for(const s in screens) screens[s].classList.remove("on"); screens[k].classList.add("on"); window.scrollTo({top:0,behavior:"instant"});}
function makeRef(){
  const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let r="AIS-";
  for(let i=0;i<5;i++) r+=c[Math.floor(Math.random()*c.length)];
  return r;
}

/* ================= LANGUAGE APPLY ================= */
function applyStatic(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang==="ar" ? "rtl" : "ltr";
  $("lang-en").classList.toggle("on", lang==="en");
  $("lang-ar").classList.toggle("on", lang==="ar");
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k=el.getAttribute("data-i");
    if(UI[k]) el.textContent = T(UI[k][0], UI[k][1]);
  });
  $("f-name").placeholder = T(UI.phName[0], UI.phName[1]);
  $("f-org").placeholder = T(UI.phOrg[0], UI.phOrg[1]);
}
function setLang(l){
  lang=l; try{localStorage.setItem("ais-fit-lang",l)}catch(e){}
  applyStatic();
  const cur = (function(){for(const s in screens){if(screens[s].classList.contains("on")) return s;} return "welcome";})();
  if(cur==="quiz") render();
  if(cur==="insight") showInsight(state.lastInsight||deterministicInsight(state.answers));
}
$("lang-en").onclick=()=>setLang("en");
$("lang-ar").onclick=()=>setLang("ar");

/* ================= RENDER ================= */
function tt(v){ return Array.isArray(v) ? T(v[0], v[1]) : v; }
function advance(){ state.i++; save(); render(); }
function render(){
  const seq=sequence(state.answers);
  if(state.i>=seq.length){ submit(); return; }
  const q=seq[state.i];
  $("pfill").style.transform="scaleX("+(state.i/seq.length)+")";
  $("pcount").textContent=(q.sec? tt(q.sec)+" · ":"")+(state.i+1)+" "+T(UI.of[0],UI.of[1])+" ~"+seq.length;
  $("qtext").textContent=tt(q.text);
  $("qhint").textContent=q.hint? tt(q.hint) : "";
  const opts=$("opts"), actions=$("qactions");
  opts.innerHTML=""; actions.innerHTML="";
  const a=state.answers;

  if(q.type==="single"){
    q.opts.forEach((o,idx)=>{
      const b=document.createElement("button");
      b.className="opt"+(a[q.id]===o.v?" sel":"");
      b.innerHTML='<span class="chip">'+String.fromCharCode(65+idx)+'</span><span>'+tt(o.t)+(o.s?'<small>'+tt(o.s)+'</small>':'')+'</span>';
      b.onclick=()=>{ a[q.id]=o.v; advance(); };
      opts.appendChild(b);
    });
  }
  else if(q.type==="multi"){
    const cur=new Set(a[q.id]||[]);
    q.opts.forEach((o,idx)=>{
      const b=document.createElement("button");
      b.className="opt"+(cur.has(o.v)?" sel":"");
      b.innerHTML='<span class="chip">'+String.fromCharCode(65+idx)+'</span><span>'+tt(o.t)+(o.s?'<small>'+tt(o.s)+'</small>':'')+'</span>';
      b.onclick=()=>{
        if(o.x){ cur.clear(); cur.add(o.v); }
        else{ q.opts.filter(z=>z.x).forEach(z=>cur.delete(z.v)); cur.has(o.v)?cur.delete(o.v):cur.add(o.v); }
        a[q.id]=[...cur]; save(); render();
      };
      opts.appendChild(b);
    });
    const c=document.createElement("button");
    c.className="btn accent"; c.textContent=T(UI.cont[0],UI.cont[1]);
    c.disabled=cur.size===0;
    c.onclick=advance;
    actions.appendChild(c);
  }
  else if(q.type==="longtext"){
    const t=document.createElement("textarea");
    t.className="freetext"; t.value=a[q.id]||""; t.placeholder=q.tph? tt(q.tph) : "";
    const note=document.createElement("div"); note.className="charnote";
    const c=document.createElement("button"); c.className="btn accent"; c.textContent=T(UI.cont[0],UI.cont[1]);
    const upd=()=>{
      const n=t.value.trim().length;
      const ok=n>=q.min;
      note.textContent= ok ? T(UI.noteOk[0],UI.noteOk[1]) : T(UI.noteLow[0],UI.noteLow[1])+" ("+n+"/"+q.min+")";
      note.className="charnote"+(ok?" ok":"");
      c.disabled=!ok;
    };
    t.oninput=()=>{ a[q.id]=t.value; if(q.onAnswer) q.onAnswer(a); save(); upd(); };
    c.onclick=()=>{ if(q.onAnswer) q.onAnswer(a); advance(); };
    upd();
    opts.appendChild(t); opts.appendChild(note); actions.appendChild(c);
    if(q.escapeLabel){
      const e=document.createElement("button"); e.className="btn ghostbtn"; e.textContent=tt(q.escapeLabel);
      e.onclick=()=>{ q.onEscape(a); advance(); };
      actions.appendChild(e);
    }
  }
  else if(q.type==="shorttext"){
    const t=document.createElement("input");
    t.className="shorttext"; t.value=a[q.id]||""; t.placeholder=q.ph? tt(q.ph) : "";
    const c=document.createElement("button"); c.className="btn accent"; c.textContent=T(UI.cont[0],UI.cont[1]);
    const upd=()=>{ c.disabled=(t.value.trim().length<3); };
    t.oninput=()=>{ a[q.id]=t.value; save(); upd(); };
    c.onclick=advance;
    upd();
    opts.appendChild(t); actions.appendChild(c);
    if(q.skipLabel){
      const skip=document.createElement("button"); skip.className="btn ghostbtn"; skip.textContent=tt(q.skipLabel);
      skip.onclick=()=>{ a[q.id]=""; advance(); };
      actions.appendChild(skip);
    }
  }
  else if(q.type==="fields"){
    const c=document.createElement("button"); c.className="btn accent"; c.textContent=T(UI.cont[0],UI.cont[1]);
    const upd=()=>{ const v=a[q.id]||{}; c.disabled=!q.fields.every(f=>v[f.key]&&v[f.key].trim().length>=2); };
    q.fields.forEach(f=>{
      const w=document.createElement("div"); w.className="field";
      const l=document.createElement("label"); l.textContent=tt(f.label); w.appendChild(l);
      const el=document.createElement("input"); el.placeholder=f.ph? tt(f.ph) : "";
      const cur=(a[q.id]||{})[f.key]; if(cur) el.value=cur;
      el.oninput=()=>{ a[q.id]=Object.assign({},a[q.id],{[f.key]:el.value}); if(q.onAnswer) q.onAnswer(a); save(); upd(); };
      w.appendChild(el); opts.appendChild(w);
    });
    c.onclick=()=>{ if(q.onAnswer) q.onAnswer(a); advance(); };
    upd(); actions.appendChild(c);
    if(q.escapeLabel){
      const e=document.createElement("button"); e.className="btn ghostbtn"; e.textContent=tt(q.escapeLabel);
      e.onclick=()=>{ q.onEscape(a); advance(); };
      actions.appendChild(e);
    }
  }
  else if(q.type==="combo2"){
    const mk=(spec,key)=>{
      const w=document.createElement("div"); w.className="field";
      const l=document.createElement("label"); l.textContent=tt(spec.label); w.appendChild(l);
      const list = Array.isArray(spec.list) ? spec.list : (spec.list[lang] || spec.list.en);
      let el;
      if(spec.kind==="datalist"){
        el=document.createElement("input"); el.setAttribute("list","dl-"+q.id+key); el.placeholder=spec.ph? tt(spec.ph) : "";
        const dl=document.createElement("datalist"); dl.id="dl-"+q.id+key;
        list.forEach(x=>{const o=document.createElement("option");o.value=x;dl.appendChild(o);});
        w.appendChild(el); w.appendChild(dl);
      }else{
        el=document.createElement("select");
        const ph=document.createElement("option"); ph.value=""; ph.textContent=T("Select…","يرجى الاختيار..."); el.appendChild(ph);
        list.forEach(x=>{const o=document.createElement("option");o.value=x;o.textContent=x;el.appendChild(o);});
        w.appendChild(el);
      }
      const cur=(a[q.id]||{})[key]; if(cur) el.value=cur;
      el.oninput=()=>{ a[q.id]=Object.assign({},a[q.id],{[key]:el.value}); save(); upd(); };
      return w;
    };
    const c=document.createElement("button"); c.className="btn accent"; c.textContent=T(UI.cont[0],UI.cont[1]);
    const upd=()=>{ const v=a[q.id]||{}; c.disabled=!(v.a&&v.a.trim()&&v.b&&v.b.trim()); };
    c.onclick=advance;
    opts.appendChild(mk(q.a,"a")); opts.appendChild(mk(q.b,"b"));
    upd(); actions.appendChild(c);
  }
}

/* ================= SUBMIT ================= */
function deterministicInsight(a){
  const route=routeOf(a);
  if(lang==="ar"){
    if(route==="problem"){
      const ev={finance:"مقاسة", sample:"مقاسة", calculated:"محسوبة", estimate:"مقدَّرة", none:"غير مقاسة", nonfinancial:"يصعب تقديرها"}[a.q5]||"فعلية";
      return "تتحملون كلفة "+ev+" في سير عمل يمكنكم وصفه بواقعة محددة، وهذا أندر مما تظنون؛ فمعظم الجهات لا تستطيع تحديد موضع الخلل بدقة، وأنتم تستطيعون.";
    }
    return "أنتم في مرحلة أبكر مما تتصورون، وهذه ميزة؛ فالجهات التي تتعثر هي التي اشترت الحلول قبل أن تحدد أسئلتها.";
  }
  if(route==="problem"){
    const ev={finance:"a measured", sample:"a measured", calculated:"a calculated", estimate:"an estimated", none:"an unmeasured", nonfinancial:"a hard-to-price"}[a.q5]||"a real";
    return "You are carrying "+ev+" cost in a process you can already describe as a specific incident. That is rarer than you think: most organizations cannot point at the moment it hurts. You can.";
  }
  return "You are earlier in this than you may feel. That is an advantage: the organizations that struggle are the ones that bought answers before understanding their questions.";
}
function submit(){
  if(state.done){ showInsight(state.lastInsight||deterministicInsight(state.answers)); return; }
  show("compute");
  state.ref=state.ref||makeRef(); save();
  const payload={token:RELAY_TOKEN, ref:state.ref, lang:lang, contact:state.contact, answers:state.answers,
                 route:routeOf(state.answers), ua:navigator.userAgent, ts:new Date().toISOString()};
  const finish=(insight,snap)=>{ state.done=true; state.lastInsight=insight; if(snap) state.lastSnap=snap; save(); showInsight(insight); };
  if(!RELAY_URL){ setTimeout(()=>finish(deterministicInsight(state.answers)), 1200); return; }
  const ctl=new AbortController(); const timer=setTimeout(()=>ctl.abort(),75000);
  fetch(RELAY_URL,{method:"POST",body:JSON.stringify(payload),signal:ctl.signal})
    .then(r=>r.json())
    .then(j=>{ clearTimeout(timer); finish((j&&j.ok&&j.insight)?j.insight:deterministicInsight(state.answers), j&&j.ok?j.snapshot:null); })
    .catch(()=>{ clearTimeout(timer); finish(deterministicInsight(state.answers)); });
}
function renderSnapshot(){
  const snap=state.lastSnap, block=$("snapblock");
  if(!snap){ block.style.display="none"; return; }
  const box=$("snapdims"); box.innerHTML="";
  SNAP_DIMS.forEach(([k,label])=>{
    const lv=Math.max(0,Math.min(4, Number(snap[k])||0));
    const d=document.createElement("div"); d.className="sdim";
    d.innerHTML='<div class="sl">'+T(label[0],label[1])+'</div>'+
      '<div class="sm">'+T(SNAP_LEVELS[lv][0],SNAP_LEVELS[lv][1])+'</div>'+
      '<div class="sbar"><i style="width:'+Math.max(8, lv/4*100)+'%"></i></div>';
    box.appendChild(d);
  });
  block.style.display="block";
}
function showInsight(text){
  $("insighttext").textContent=text;
  $("reffoot").textContent=state.ref||"";
  renderSnapshot();
  if(new URLSearchParams(location.search).has("tester")){
    const tb=$("testerbox"); tb.innerHTML="";
    const b=document.createElement("button");
    b.className="btn ghostbtn"; b.style.marginBottom="26px"; b.textContent=T(UI.newRun[0],UI.newRun[1]);
    b.onclick=()=>{ try{localStorage.removeItem("ais-fit");}catch(e){} location.reload(); };
    tb.appendChild(b);
  }
  show("insight");
}

/* ================= WIRING ================= */
$("introbtn").onclick=()=>{ show("brief"); };
$("briefback").onclick=()=>{ show("welcome"); };
$("startbtn").onclick=()=>{
  const name=$("f-name").value.trim(), org=$("f-org").value.trim(), email=$("f-email").value.trim();
  if(!name||!org||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){
    [["f-name",name],["f-org",org],["f-email",/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)?email:""]].forEach(([id,v])=>{
      $(id).style.borderColor = v? "var(--rule2)" : "var(--accent)";
    });
    return;
  }
  state.contact={name,org,email}; state.i=0; save(); show("quiz"); render();
};
$("backbtn").onclick=()=>{
  if(state.i===0){ show("brief"); return; }
  state.i--; save(); render();
};
/* boot */
applyStatic();
if(state.done){ showInsight(state.lastInsight||deterministicInsight(state.answers)); }
else if(state.contact.email && Object.keys(state.answers).length>0){ show("quiz"); render(); }
</script>
